<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0e14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PilotWx" />
  <meta name="description" content="Pilot weather app for METAR and D-ATIS" />
  <title>PilotWx</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0a0e14;
      --bg2:       #111720;
      --bg3:       #1a2233;
      --border:    #1e2d42;
      --accent:    #00d4ff;
      --accent2:   #ff6b35;
      --green:     #39ff7a;
      --yellow:    #ffd93d;
      --red:       #ff4444;
      --text:      #c8d8e8;
      --text-dim:  #5a7a9a;
      --mono:      'Share Tech Mono', monospace;
      --sans:      'Barlow Condensed', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,212,255,0.012) 2px, rgba(0,212,255,0.012) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { display: flex; align-items: baseline; gap: 6px; }
    .logo-mark { font-family: var(--mono); font-size: 22px; color: var(--accent); letter-spacing: -1px; }
    .logo-sub  { font-family: var(--sans); font-weight: 300; font-size: 11px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; }

    .utc-clock { font-family: var(--mono); font-size: 13px; color: var(--text-dim); text-align: right; line-height: 1.4; }
    .utc-time  { color: var(--accent); font-size: 16px; }

    .search-bar {
      padding: 14px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icao-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 22px;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
      min-width: 0;
    }
    .icao-input::placeholder { color: var(--text-dim); letter-spacing: 2px; font-size: 16px; }
    .icao-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,212,255,0.12); }

    .btn {
      background: var(--accent);
      color: var(--bg);
      font-family: var(--sans);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      padding: 12px 18px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.96); background: #00b8e0; }
    .btn-secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-secondary:active { background: rgba(0,212,255,0.1); }

    .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg2); }
    .tab {
      flex: 1;
      padding: 10px;
      font-family: var(--sans);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab.active   { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:disabled { opacity: 0.3; cursor: not-allowed; }

    .content { padding: 14px 16px; max-width: 640px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }

    .status-bar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px;
      font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); }
    .dot.ok    { background: var(--green);  box-shadow: 0 0 6px var(--green); }
    .dot.warn  { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
    .dot.error { background: var(--red);    box-shadow: 0 0 6px var(--red); }

    .wx-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .wx-card-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,212,255,0.04);
    }
    .wx-card-title { font-family: var(--sans); font-weight: 700; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-dim); }
    .wx-card-age   { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
    .wx-card-age.fresh { color: var(--green); }
    .wx-card-age.stale { color: var(--yellow); }
    .wx-card-age.old   { color: var(--red); }

    .raw-metar {
      padding: 12px 14px;
      font-family: var(--mono); font-size: 13px; line-height: 1.7;
      color: var(--text); word-break: break-all;
      border-bottom: 1px solid var(--border);
      background: var(--bg3);
    }

    .decoded-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1px; background: var(--border);
    }
    .wx-item { background: var(--bg2); padding: 10px 14px; }
    .wx-label { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 3px; }
    .wx-value { font-family: var(--mono); font-size: 18px; color: var(--text); line-height: 1.2; }
    .wx-value.vfr  { color: var(--green); }
    .wx-value.mvfr { color: var(--accent); }
    .wx-value.ifr  { color: var(--red); }
    .wx-value.lifr { color: #cc44ff; }
    .wx-value small { font-size: 11px; color: var(--text-dim); margin-left: 3px; }

    .flt-cat { text-align: center; padding: 8px; font-family: var(--sans); font-weight: 700; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
    .flt-cat.VFR  { background: rgba(57,255,122,0.15); color: var(--green); }
    .flt-cat.MVFR { background: rgba(0,212,255,0.15);  color: var(--accent); }
    .flt-cat.IFR  { background: rgba(255,68,68,0.15);  color: var(--red); }
    .flt-cat.LIFR { background: rgba(204,68,255,0.15); color: #cc44ff; }

    /* TAF */
    .taf-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 14px;
    }
    .taf-raw {
      padding: 12px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.9;
      color: var(--text); word-break: break-all; background: var(--bg3);
    }
    .taf-period {
      border-top: 1px solid var(--border); padding: 8px 14px;
      display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline;
    }
    .taf-period:nth-child(even) { background: rgba(0,212,255,0.02); }
    .taf-time { font-family: var(--mono); font-size: 11px; color: var(--accent); min-width: 90px; }
    .taf-wx   { font-family: var(--mono); font-size: 12px; color: var(--text); flex: 1; }
    .taf-cat  { font-family: var(--sans); font-weight: 700; font-size: 10px; letter-spacing: 1.5px; padding: 2px 6px; border-radius: 2px; }
    .taf-cat.VFR  { background: rgba(57,255,122,0.2);  color: var(--green); }
    .taf-cat.MVFR { background: rgba(0,212,255,0.2);   color: var(--accent); }
    .taf-cat.IFR  { background: rgba(255,68,68,0.2);   color: var(--red); }
    .taf-cat.LIFR { background: rgba(204,68,255,0.2);  color: #cc44ff; }

    .atis-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
    .atis-header {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      background: rgba(255,107,53,0.06);
      display: flex; justify-content: space-between; align-items: center;
    }
    .atis-info-code { font-family: var(--mono); font-size: 28px; color: var(--accent2); }
    .atis-body { padding: 12px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.9; color: var(--text); }
    .atis-line { margin-bottom: 2px; }
    .atis-key  { color: var(--text-dim); margin-right: 8px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }
    .empty-icon  { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
    .empty-state h3 { font-family: var(--sans); font-weight: 600; font-size: 16px; letter-spacing: 1px; margin-bottom: 6px; color: var(--text-dim); }
    .empty-state p  { font-size: 13px; line-height: 1.5; }

    .error-msg {
      background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3);
      border-radius: 4px; padding: 12px 14px;
      font-family: var(--mono); font-size: 12px; color: var(--red); margin-bottom: 12px;
    }

    .loader { display: flex; align-items: center; gap: 10px; padding: 20px; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }

    .history-row {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 8px 16px 10px; border-bottom: 1px solid var(--border);
      background: var(--bg); min-height: 38px;
    }
    .hist-chip {
      font-family: var(--mono); font-size: 12px; letter-spacing: 1px;
      color: var(--text-dim); background: var(--bg3);
      border: 1px solid var(--border); border-radius: 3px; padding: 3px 9px; cursor: pointer;
      transition: color 0.1s, border-color 0.1s;
    }
    .hist-chip:hover { color: var(--accent); border-color: var(--accent); }

    .refresh-row { display: flex; gap: 8px; margin-bottom: 14px; }

    .remarks { padding: 10px 14px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); line-height: 1.7; border-top: 1px solid var(--border); }
    .remarks-label { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }

    .no-atis { padding: 20px; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }

    .offline-banner {
      background: rgba(255,107,53,0.15); border-bottom: 1px solid rgba(255,107,53,0.4);
      padding: 7px 16px; font-family: var(--mono); font-size: 11px;
      color: var(--accent2); text-align: center; display: none;
    }
    .offline-banner.show { display: block; }

    .proxy-note {
      background: rgba(255,211,61,0.08); border: 1px solid rgba(255,211,61,0.25);
      border-radius: 4px; padding: 8px 12px;
      font-family: var(--mono); font-size: 10px; color: var(--yellow);
      margin-bottom: 12px; line-height: 1.6;
    }

    @media (max-width: 380px) {
      .icao-input { font-size: 18px; }
      .wx-value { font-size: 15px; }
    }
  </style>
</head>
<body>

<div class="offline-banner" id="offlineBanner">⚠ OFFLINE — Showing cached data</div>

<header>
  <div class="logo">
    <span class="logo-mark">✈ PILOTWX</span>
    <span class="logo-sub">Weather</span>
  </div>
  <div class="utc-clock">
    <div class="utc-time" id="utcTime">--:--:--</div>
    <div id="utcDate">---- UTC</div>
  </div>
</header>

<div class="search-bar">
  <input
    class="icao-input"
    id="icaoInput"
    type="text"
    maxlength="4"
    placeholder="ICAO"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="characters"
    spellcheck="false"
  />
  <button class="btn" id="fetchBtn" onclick="fetchWeather()">GO</button>
</div>

<div class="history-row" id="historyRow"></div>

<div class="tabs">
  <button class="tab active" id="tabMetar" onclick="switchTab('metar')">METAR</button>
  <button class="tab" id="tabTaf"   onclick="switchTab('taf')"  disabled>TAF</button>
  <button class="tab" id="tabAtis"  onclick="switchTab('atis')" disabled>D-ATIS</button>
</div>

<div class="content">

  <div class="panel active" id="panelMetar">
    <div id="metarContent">
      <div class="empty-state">
        <div class="empty-icon">🛫</div>
        <h3>Enter Airport ICAO</h3>
        <p>Type a 4-letter ICAO identifier<br>and press GO</p>
      </div>
    </div>
  </div>

  <div class="panel" id="panelTaf">
    <div id="tafContent">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <h3>No TAF Loaded</h3>
        <p>Fetch a METAR first</p>
      </div>
    </div>
  </div>

  <div class="panel" id="panelAtis">
    <div id="atisContent">
      <div class="empty-state">
        <div class="empty-icon">📡</div>
        <h3>No D-ATIS Loaded</h3>
        <p>Fetch a METAR first, then check<br>if D-ATIS is available</p>
      </div>
    </div>
  </div>

</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────
// PROXY OPTIONS (edit to match your deployment):
//
//   OPTION A — Self-hosted Cloudflare Worker (recommended for production)
//              Deploy worker.js to Cloudflare Workers, set PROXY_BASE to your worker URL.
//              e.g. 'https://pilotwx-proxy.YOUR-SUBDOMAIN.workers.dev'
//
//   OPTION B — corsproxy.io  (free, works on GitHub Pages / local dev)
//              Set PROXY_BASE = '' to use the built-in corsproxy.io fallback.
//
const PROXY_BASE = 'https://pilotapp.aotfnat.workers.dev/';  // ← set to your Cloudflare Worker URL when deployed (trailing slash optional)

// Normalize: strip any trailing slash so URLs never get a double-slash
const _BASE = PROXY_BASE.replace(/\/+$/, '');

function metarUrl(icao) {
  const target = `https://aviationweather.gov/api/data/metar?ids=${icao}&format=json&hours=2`;
  if (_BASE) return `${_BASE}/metar?ids=${icao}`;
  return `https://corsproxy.io/?url=${encodeURIComponent(target)}`;
}

function tafUrl(icao) {
  const target = `https://aviationweather.gov/api/data/taf?ids=${icao}&format=json&time=valid`;
  if (_BASE) return `${_BASE}/taf?ids=${icao}`;
  return `https://corsproxy.io/?url=${encodeURIComponent(target)}`;
}

function atisUrl(icao) {
  const target = `https://datis.clowd.io/api/${icao}`;
  if (_BASE) return `${_BASE}/atis/${icao}`;
  return `https://corsproxy.io/?url=${encodeURIComponent(target)}`;
}

// ─── UTC CLOCK ────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const hh = String(now.getUTCHours()).padStart(2,'0');
  const mm = String(now.getUTCMinutes()).padStart(2,'0');
  const ss = String(now.getUTCSeconds()).padStart(2,'0');
  document.getElementById('utcTime').textContent = `${hh}:${mm}:${ss}`;
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('utcDate').textContent =
    `${String(now.getUTCDate()).padStart(2,'0')} ${months[now.getUTCMonth()]} UTC`;
}
setInterval(updateClock, 1000);
updateClock();

// ─── OFFLINE DETECTION ───────────────────────────────────────
window.addEventListener('online',  () => document.getElementById('offlineBanner').classList.remove('show'));
window.addEventListener('offline', () => document.getElementById('offlineBanner').classList.add('show'));
if (!navigator.onLine) document.getElementById('offlineBanner').classList.add('show');

// ─── HISTORY ─────────────────────────────────────────────────
let wxHistory = JSON.parse(localStorage.getItem('wxHistory') || '[]');
let currentICAO = '';
let atisAvailable = false;

function renderHistory() {
  const row = document.getElementById('historyRow');
  row.innerHTML = '';
  wxHistory.slice(0,8).forEach(icao => {
    const chip = document.createElement('button');
    chip.className = 'hist-chip';
    chip.textContent = icao;
    chip.onclick = () => {
      document.getElementById('icaoInput').value = icao;
      fetchWeather();
    };
    row.appendChild(chip);
  });
}

function addHistory(icao) {
  wxHistory = [icao, ...wxHistory.filter(x => x !== icao)].slice(0,8);
  localStorage.setItem('wxHistory', JSON.stringify(wxHistory));
  renderHistory();
}

renderHistory();

// ─── TABS ─────────────────────────────────────────────────────
function switchTab(tab) {
  ['metar','taf','atis'].forEach(t => {
    document.getElementById('panel' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === tab);
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === tab);
  });
}

// ─── METAR PARSING ───────────────────────────────────────────
function parseMetar(raw) {
  const out = { raw };

  const tMatch = raw.match(/\b(\d{2})(\d{2})(\d{2})Z\b/);
  if (tMatch) out.time = `${tMatch[1]}d ${tMatch[2]}:${tMatch[3]}Z`;

  const wMatch = raw.match(/\b(\d{3}|VRB)(\d{2,3})(G(\d{2,3}))?KT\b/);
  if (wMatch) {
    const spd = parseInt(wMatch[2]);
    out.windStr = wMatch[1] === 'VRB'
      ? `VRB ${spd}${wMatch[4] ? 'G'+wMatch[4] : ''}KT`
      : `${wMatch[1]}° ${spd}${wMatch[4] ? 'G'+wMatch[4] : ''}KT`;
  }

  const vMatch = raw.match(/\b(\d+(?:\/\d+)?\s*SM)\b/);
  if (vMatch) out.vis = vMatch[1];

  const skyParts = [];
  const skyRe = /\b(SKC|CLR|FEW|SCT|BKN|OVC)(\d{3})?(CB|TCU)?\b/g;
  let sm;
  while ((sm = skyRe.exec(raw)) !== null) {
    const cover = sm[1];
    const alt = sm[2] ? parseInt(sm[2]) * 100 : null;
    const altStr = alt ? alt.toLocaleString()+'ft' : '';
    skyParts.push(`${cover}${altStr}${sm[3]||''}`);
    if (!out.ceiling && (cover === 'BKN' || cover === 'OVC') && alt) out.ceiling = alt;
  }
  out.sky = skyParts.join(' ') || 'CLR';

  const tdMatch = raw.match(/\b(M?\d{2})\/(M?\d{2})\b/);
  if (tdMatch) {
    out.temp = tdMatch[1].replace('M','-');
    out.dew  = tdMatch[2].replace('M','-');
  }

  const aMatch = raw.match(/\bA(\d{4})\b/);
  if (aMatch) out.altim = (parseInt(aMatch[1]) / 100).toFixed(2) + ' inHg';
  const qMatch = raw.match(/\bQ(\d{4})\b/);
  if (qMatch && !aMatch) out.altim = parseInt(qMatch[1]) + ' hPa';

  const wxPhenomena = raw.match(/\b(-|\+|VC)?(TS|SH|FZ|DR|BL|MI|PR|BC|DZ|RA|SN|SG|IC|PL|GR|GS|BR|FG|FU|VA|DU|SA|HZ|PY|PO|SQ|FC|SS|DS)+\b/g);
  if (wxPhenomena) out.wx = wxPhenomena.join(' ');

  const vis_sm = out.vis ? parseFloat(out.vis) : 10;
  const ceil = out.ceiling || 9999;
  if      (ceil < 500  || vis_sm < 1) out.flightCat = 'LIFR';
  else if (ceil < 1000 || vis_sm < 3) out.flightCat = 'IFR';
  else if (ceil < 3000 || vis_sm < 5) out.flightCat = 'MVFR';
  else                                 out.flightCat = 'VFR';

  const rmkIdx = raw.indexOf(' RMK ');
  if (rmkIdx !== -1) out.remarks = raw.substring(rmkIdx + 5);

  return out;
}

function fcClass(cat) {
  return { VFR:'vfr', MVFR:'mvfr', IFR:'ifr', LIFR:'lifr' }[cat] || '';
}

function metarAge(raw) {
  const tMatch = raw.match(/\b\d{2}(\d{2})(\d{2})Z\b/);
  if (!tMatch) return { label: 'Unknown', cls: '' };
  const now = new Date();
  const obsMin = parseInt(tMatch[1]) * 60 + parseInt(tMatch[2]);
  const nowMin = now.getUTCHours() * 60 + now.getUTCMinutes();
  let diff = nowMin - obsMin;
  if (diff < 0) diff += 1440;
  if (diff < 65)  return { label: `${diff}m ago`, cls: 'fresh' };
  if (diff < 120) return { label: `${diff}m ago`, cls: 'stale' };
  return { label: `${diff}m ago`, cls: 'old' };
}

function renderMetar(data) {
  const raw = data.rawOb || data.raw_text || (typeof data === 'string' ? data : JSON.stringify(data));
  const m = parseMetar(raw);
  const age = metarAge(m.raw);
  const cat = m.flightCat || 'VFR';

  let html = `
    <div class="wx-card">
      <div class="wx-card-header">
        <span class="wx-card-title">METAR · ${currentICAO}</span>
        <span class="wx-card-age ${age.cls}">${age.label}</span>
      </div>
      <div class="raw-metar">${m.raw}</div>
      <div class="flt-cat ${cat}">${cat}</div>
      <div class="decoded-grid">`;

  if (m.windStr) html += `<div class="wx-item"><div class="wx-label">Wind</div><div class="wx-value">${m.windStr}</div></div>`;
  if (m.vis)     html += `<div class="wx-item"><div class="wx-label">Visibility</div><div class="wx-value">${m.vis}</div></div>`;
  html += `<div class="wx-item"><div class="wx-label">Sky</div><div class="wx-value" style="font-size:13px">${m.sky}</div></div>`;
  if (m.ceiling) html += `<div class="wx-item"><div class="wx-label">Ceiling</div><div class="wx-value ${fcClass(cat)}">${m.ceiling.toLocaleString()}<small>ft</small></div></div>`;
  if (m.temp)    html += `<div class="wx-item"><div class="wx-label">Temp / Dew</div><div class="wx-value">${m.temp}° <small>/</small> ${m.dew}°<small>C</small></div></div>`;
  if (m.altim)   html += `<div class="wx-item"><div class="wx-label">Altimeter</div><div class="wx-value" style="font-size:15px">${m.altim}</div></div>`;
  if (m.wx)      html += `<div class="wx-item" style="grid-column:1/-1"><div class="wx-label">Weather</div><div class="wx-value" style="font-size:14px;color:var(--yellow)">${m.wx}</div></div>`;

  html += `</div>`;
  if (m.remarks) html += `<div class="remarks"><div class="remarks-label">Remarks</div>${m.remarks}</div>`;
  html += `</div>`;
  html += `<div class="refresh-row"><button class="btn btn-secondary" style="flex:1" onclick="fetchWeather()">↻ REFRESH</button></div>`;

  document.getElementById('metarContent').innerHTML = html;
}

// ─── TAF PARSING ─────────────────────────────────────────────
function parseTafPeriod(text) {
  const vis_sm = (() => { const m = text.match(/\b(\d+(?:\/\d+)?)\s*SM\b/); return m ? parseFloat(m[1]) : 10; })();
  let ceil = 9999;
  const skyRe2 = /\b(BKN|OVC)(\d{3})\b/g;
  let sm2;
  while ((sm2 = skyRe2.exec(text)) !== null) {
    const alt = parseInt(sm2[2]) * 100;
    if (alt < ceil) ceil = alt;
  }
  if      (ceil < 500  || vis_sm < 1) return 'LIFR';
  else if (ceil < 1000 || vis_sm < 3) return 'IFR';
  else if (ceil < 3000 || vis_sm < 5) return 'MVFR';
  else                                 return 'VFR';
}

function renderTaf(data) {
  if (!data || !data.length) {
    document.getElementById('tafContent').innerHTML = `<div class="no-atis"><div style="font-size:30px;margin-bottom:10px;opacity:0.3">📋</div><div>No TAF available for ${currentICAO}</div></div>`;
    document.getElementById('tabTaf').disabled = true;
    return;
  }
  document.getElementById('tabTaf').disabled = false;

  const t = data[0];
  const rawTaf = t.rawTAF || t.raw_text || '';

  let html = `<div class="taf-card">
    <div class="wx-card-header">
      <span class="wx-card-title">TAF · ${currentICAO}</span>
      <span class="wx-card-age fresh">Valid ${t.validTimeFrom || ''} → ${t.validTimeTo || ''}</span>
    </div>
    <div class="taf-raw">${rawTaf}</div>`;

  // Parse forecast periods from raw TAF
  if (rawTaf) {
    const periods = rawTaf.split(/\b(FM\d{6}|BECMG|TEMPO|PROB\d{2})\b/).filter(Boolean);
    const groups = [];
    let current = null;
    periods.forEach(p => {
      if (/^(FM\d{6}|BECMG|TEMPO|PROB\d{2})$/.test(p.trim())) {
        if (current) groups.push(current);
        current = { type: p.trim(), text: '' };
      } else if (current) {
        current.text += p;
      } else {
        // Initial conditions
        current = { type: 'INIT', text: p };
      }
    });
    if (current) groups.push(current);

    groups.forEach(g => {
      const fc = parseTafPeriod(g.text);
      let timeLabel = g.type;
      if (/^FM(\d{2})(\d{2})(\d{2})$/.test(g.type)) {
        const mm = g.type.match(/^FM(\d{2})(\d{2})(\d{2})$/);
        timeLabel = `FM ${mm[1]}d ${mm[2]}:${mm[3]}Z`;
      }
      html += `<div class="taf-period">
        <span class="taf-time">${timeLabel}</span>
        <span class="taf-wx">${g.text.trim().replace(/\s+/g,' ')}</span>
        <span class="taf-cat ${fc}">${fc}</span>
      </div>`;
    });
  }

  html += `</div>`;
  html += `<div class="refresh-row"><button class="btn btn-secondary" style="flex:1" onclick="fetchWeather()">↻ REFRESH</button></div>`;
  document.getElementById('tafContent').innerHTML = html;
}

// ─── ATIS RENDER ─────────────────────────────────────────────
function renderAtis(atis) {
  if (!atis || !atis.length) {
    document.getElementById('atisContent').innerHTML = `
      <div class="no-atis">
        <div style="font-size:30px;margin-bottom:10px;opacity:0.3">📡</div>
        <div>No D-ATIS available for ${currentICAO}</div>
        <div style="margin-top:6px;font-size:11px;color:var(--text-dim)">D-ATIS is only available at select major airports</div>
      </div>`;
    atisAvailable = false;
    document.getElementById('tabAtis').disabled = true;
    return;
  }

  atisAvailable = true;
  document.getElementById('tabAtis').disabled = false;

  const a = atis[0];
  let html = `<div class="atis-card">
    <div class="atis-header">
      <div>
        <div class="wx-card-title">D-ATIS · ${currentICAO}</div>
        <div style="font-size:11px;color:var(--text-dim);font-family:var(--mono);margin-top:2px">${a.facility_type || a.type || 'ATIS'}</div>
      </div>
      <div class="atis-info-code">${a.information_code || a.info || '?'}</div>
    </div>
    <div class="atis-body">`;

  // datis.clowd.io returns { datis, airport, type }
  if (a.datis) {
    html += `<div style="line-height:1.9">${a.datis}</div>`;
  } else {
    const fields = [
      ['Time', a.time], ['Wind', a.wind], ['Visibility', a.visibility],
      ['Sky', a.sky_condition], ['Temp/Dew', a.temp_dewpoint],
      ['Altimeter', a.altimeter], ['Runway', a.runway_in_use],
      ['Approaches', a.approaches_in_use], ['NOTAMs', a.notams],
      ['Remarks', a.remarks], ['Text', a.text],
    ];
    fields.forEach(([label, val]) => {
      if (val) html += `<div class="atis-line"><span class="atis-key">${label}</span>${val}</div>`;
    });
  }

  html += `</div></div>`;
  html += `<div class="refresh-row"><button class="btn btn-secondary" style="flex:1" onclick="fetchWeather()">↻ REFRESH</button></div>`;
  document.getElementById('atisContent').innerHTML = html;
}

// ─── FETCH ────────────────────────────────────────────────────
async function safeFetch(url, timeout = 12000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch(e) {
    clearTimeout(timer);
    throw e;
  }
}

async function fetchWeather() {
  const raw = document.getElementById('icaoInput').value.trim().toUpperCase();
  if (!raw || raw.length < 3) { document.getElementById('icaoInput').focus(); return; }

  currentICAO = raw;
  addHistory(raw);

  document.getElementById('metarContent').innerHTML = `<div class="loader"><div class="spinner"></div>Fetching METAR for ${raw}…</div>`;
  document.getElementById('tafContent').innerHTML   = `<div class="loader"><div class="spinner"></div>Fetching TAF for ${raw}…</div>`;
  document.getElementById('atisContent').innerHTML  = `<div class="loader"><div class="spinner"></div>Checking D-ATIS for ${raw}…</div>`;
  document.getElementById('tabAtis').disabled = true;
  document.getElementById('tabTaf').disabled  = true;
  switchTab('metar');

  // ── METAR ──
  try {
    const data = await safeFetch(metarUrl(raw));
    if (!data || data.length === 0) {
      document.getElementById('metarContent').innerHTML =
        `<div class="error-msg">No METAR found for ${raw}. Verify the ICAO identifier.</div>
         <div class="empty-state"><p>US airports use K prefix (e.g. KPHX, KLAX)</p></div>`;
    } else {
      renderMetar(data[0]);
    }
  } catch(e) {
    document.getElementById('metarContent').innerHTML =
      `<div class="error-msg">METAR fetch failed: ${e.message}</div>
       <div class="empty-state"><p>Check your connection and try again.</p></div>`;
  }

  // ── TAF ──
  try {
    const data = await safeFetch(tafUrl(raw));
    renderTaf(Array.isArray(data) ? data : []);
  } catch(e) {
    renderTaf([]);
  }

  // ── D-ATIS ──
  try {
    const data = await safeFetch(atisUrl(raw), 10000);
    if (Array.isArray(data) && data.length > 0) {
      renderAtis(data);
    } else {
      renderAtis([]);
    }
  } catch(e) {
    renderAtis([]);
  }
}

// ─── ENTER KEY ────────────────────────────────────────────────
document.getElementById('icaoInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchWeather();
  setTimeout(() => { e.target.value = e.target.value.toUpperCase(); }, 0);
});

// ─── SERVICE WORKER ───────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW reg failed:', err));
}
